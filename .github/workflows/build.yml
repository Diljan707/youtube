name: Build ReVanced APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download ReVanced Files
        run: |
          # Downloading ReVanced CLI, Patches, and Integrations directly via stable GitHub release redirects
          curl -L -o cli.jar "https://github.com/ReVanced/revanced-cli/releases/latest/download/revanced-cli.jar"
          curl -L -o patches.jar "https://github.com/ReVanced/revanced-patches/releases/latest/download/patches.jar"
          curl -L -o integrations.apk "https://github.com/ReVanced/revanced-integrations/releases/latest/download/app-release-unsigned.apk"

      - name: Download YouTube APK
        run: |
          YOUTUBE_VERSION="19.16.39"
          echo "Downloading YouTube v$YOUTUBE_VERSION..."
          
          python3 -c "
          import urllib.request
          url = 'https://d.apkcombo.com/com.google.android.youtube_${YOUTUBE_VERSION}_minAPI26(arm64-v8a,armeabi-v7a,x86,x86_64)(nodpi)_apkmirror.com.apk'
          headers = {'User-Agent': 'Mozilla/5.0'}
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as response, open('youtube.apk', 'wb') as out_file:
                  out_file.write(response.read())
          except Exception as e:
              print('Download error:', e)
          "

      - name: Patch YouTube (All Patches, Custom Icon & Name)
        run: |
          java -jar cli.jar patch \
            --patches=patches.jar \
            --integrations=integrations.apk \
            --out=final-revanced.apk \
            --app-name="ReVanced" \
            --icon=icon.png \
            youtube.apk

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ReVanced-YouTube
          path: final-revanced.apk
