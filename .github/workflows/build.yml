name: Build ReVanced APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get Latest ReVanced CLI, Patches, and Integrations
        run: |
          # Fetching latest releases from GitHub API
          CLI_URL=$(curl -s https://api.github.com/repos/ReVanced/revanced-cli/releases/latest | grep "browser_download_url.*.jar" | cut -d '"' -f 4)
          PATCHES_URL=$(curl -s https://api.github.com/repos/ReVanced/revanced-patches/releases/latest | grep "browser_download_url.*.jar" | cut -d '"' -f 4)
          INTEGRATIONS_URL=$(curl -s https://api.github.com/repos/ReVanced/revanced-integrations/releases/latest | grep "browser_download_url.*.apk" | cut -d '"' -f 4)

          curl -L -o cli.jar "$CLI_URL"
          curl -L -o patches.jar "$PATCHES_URL"
          curl -L -o integrations.apk "$INTEGRATIONS_URL"

      - name: Download YouTube APK
        run: |
          # Automatically downloads a compatible YouTube APK from an uptodate source
          # You can change the version if needed
          YOUTUBE_VERSION="19.16.39"
          echo "Downloading YouTube v$YOUTUBE_VERSION..."
          
          # Using a reliable mirror to fetch YouTube APK without using your phone data
          curl -L -o youtube.apk "https://github.com/ReVanced/revanced-patches/releases/download/v2.201.0/yt-$YOUTUBE_VERSION.apk" || \
          curl -L -o youtube.apk "https://mirror.apkcombo.com/app/download?package=com.google.android.youtube&version=$YOUTUBE_VERSION"
          
          # Fallback direct fetch if mirror fails
          if [ ! -f "youtube.apk" ] || [ ! -s "youtube.apk" ]; then
            # Direct API pull for APKMirror link simulation
            python3 -c "
            import urllib.request
            url = 'https://d.apkcombo.com/com.google.android.youtube_${YOUTUBE_VERSION}_minAPI26(arm64-v8a,armeabi-v7a,x86,x86_64)(nodpi)_apkmirror.com.apk'
            headers = {'User-Agent': 'Mozilla/5.0'}
            req = urllib.request.Request(url, headers=headers)
            try:
                with urllib.request.urlopen(req) as response, open('youtube.apk', 'wb') as out_file:
                    out_file.write(response.read())
            except Exception as e:
                print('Download error:', e)
            "
          fi

      - name: Patch YouTube (All Patches, Custom Icon & Name)
        run: |
          # Here we apply all patches, change app name to 'ReVanced' and set custom icon 'icon.png'
          java -jar cli.jar patch \
            --patches=patches.jar \
            --integrations=integrations.apk \
            --out=final-revanced.apk \
            --app-name="ReVanced" \
            --icon=icon.png \
            youtube.apk

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ReVanced-YouTube
          path: final-revanced.apk
