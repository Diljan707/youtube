name: Build Morphe APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Morphe CLI and YouTube
        run: |
          # Downloading Morphe/ReVanced compatible CLI and YouTube APK
          curl -L -o cli.jar "https://github.com/ReVanced/revanced-cli/releases/latest/download/revanced-cli.jar"
          curl -L -o youtube.apk "https://github.com/revanced-apks/build-space/releases/download/YouTube-v19.16.39/youtube-v19.16.39.apk"

      - name: Download Morphe Patches
        run: |
          # Downloading Morphe patches directly from their repository
          curl -L -o patches.jar "https://github.com/Morphe-App/morphe-patches/releases/latest/download/patches.jar" || \
          curl -L -o patches.jar "https://github.com/ReVanced/revanced-patches/releases/latest/download/patches.jar"

      - name: Patch with Morphe
        run: |
          java -jar cli.jar patch \
            --patches=patches.jar \
            --out=morphe-final.apk \
            --app-name="YouTube" \
            --icon=icon.png \
            youtube.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-YouTube
          path: morphe-final.apk
