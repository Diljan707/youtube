name: Build ReVanced APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Necessary Files
        run: |
          # Direct stable links to avoid GitHub API errors
          curl -L -o cli.jar "https://github.com/ReVanced/revanced-cli/releases/latest/download/revanced-cli.jar"
          curl -L -o patches.jar "https://github.com/ReVanced/revanced-patches/releases/latest/download/patches.jar"
          curl -L -o integrations.apk "https://github.com/ReVanced/revanced-integrations/releases/latest/download/app-release-unsigned.apk"
          
          # Use a stable YouTube APK mirror link that doesn't fail
          curl -L -o youtube.apk "https://github.com/revanced-apks/build-space/releases/download/YouTube-v19.16.39/youtube-v19.16.39.apk"

      - name: Patch YouTube
        run: |
          # Patching process
          java -jar cli.jar patch \
            --patches=patches.jar \
            --integrations=integrations.apk \
            --out=final-revanced.apk \
            --app-name="ReVanced" \
            --icon=icon.png \
            youtube.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Final-YouTube-ReVanced
          path: final-revanced.apk
